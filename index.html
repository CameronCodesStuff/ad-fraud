<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CoinRush</title>

    <!-- Google AdSense -->
    <script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5567025157222511"
        crossorigin="anonymous">
    </script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        #game {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 20%, #243b65 0%, transparent 35%),
                linear-gradient(#182848, #080b12);
        }

        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            padding: 10px 15px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.45);
            font-size: 22px;
            font-weight: bold;
        }

        #player {
            position: absolute;
            width: 45px;
            height: 45px;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 10px;
            background: #4da6ff;
            box-shadow: 0 0 20px #4da6ff;
        }

        #player::after {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.2);
        }

        .coin {
            position: absolute;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: radial-gradient(
                circle at 35% 30%,
                #fff176,
                #ffd000 45%,
                #e6a900
            );
            border: 3px solid #ffb700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.9);
        }

        .coin::after {
            content: "$";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9b6b00;
            font-weight: bold;
            font-size: 16px;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 100;
            text-align: center;
            background: rgba(0, 0, 0, 0.94);
            padding: 20px;
        }

        .overlay h1 {
            margin: 0 0 15px;
            font-size: clamp(40px, 8vw, 70px);
        }

        .overlay p {
            font-size: 20px;
            color: #ddd;
            margin: 8px 0;
        }

        button {
            margin-top: 20px;
            padding: 12px 28px;
            border: none;
            border-radius: 9px;
            background: #4da6ff;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
        }

        button:hover {
            background: #268cff;
            transform: scale(1.04);
        }

        #secretScreen {
            background:
                radial-gradient(
                    circle at center,
                    #4b0082 0%,
                    #18001f 45%,
                    #050005 100%
                );
            overflow-y: auto;
        }

        #secretScreen h1 {
            color: #ff4dff;
            text-shadow:
                0 0 10px #ff00ff,
                0 0 30px #ff00ff;
        }

        .secret-badge {
            padding: 8px 15px;
            border: 1px solid #ff4dff;
            border-radius: 999px;
            color: #ff8cff;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .ad-container {
            width: min(90vw, 728px);
            min-height: 90px;
            margin: 20px auto;
            padding: 10px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
        }

        #hint {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.45);
            font-size: 13px;
            z-index: 5;
            white-space: nowrap;
        }
    </style>
</head>

<body>

<div id="game">

    <div id="hud">
        🪙 Coins: <span id="score">0</span>
    </div>

    <div id="hint">
        ← → / A D to move
    </div>

    <div id="player"></div>


    <!-- GAME OVER -->
    <div id="gameOver" class="overlay">

        <h1>💀 Game Over</h1>

        <p>
            You collected
            <strong><span id="finalScore">0</span></strong>
            coins.
        </p>

        <button onclick="restartGame()">
            Run it back
        </button>

    </div>


    <!-- SECRET SCREEN -->
    <div id="secretScreen" class="overlay">

        <div class="secret-badge">
            SECRET AREA
        </div>

        <h1>🔮 SECRET SCREEN</h1>

        <p>
            Wagwan... you found the forbidden ting 👀
        </p>

        <p>
            Only the real mandem know about Right Alt.
        </p>


        <!-- ADSENSE AD -->
        <div class="ad-container">

            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-5567025157222511"
                 data-ad-slot="YOUR_AD_SLOT_ID"
                 data-ad-format="auto"
                 data-full-width-responsive="true">
            </ins>

        </div>


        <button onclick="closeSecret()">
            Back to CoinRush
        </button>

    </div>

</div>


<script>

    const game = document.getElementById("game");
    const player = document.getElementById("player");

    const scoreDisplay = document.getElementById("score");
    const finalScore = document.getElementById("finalScore");

    const gameOverScreen =
        document.getElementById("gameOver");

    const secretScreen =
        document.getElementById("secretScreen");


    let score = 0;

    let playerX =
        window.innerWidth / 2;

    let coins = [];

    let gameRunning = true;

    let secretAdLoaded = false;


    const keys = {};


    /*
     * KEYBOARD CONTROLS
     */
    document.addEventListener("keydown", function(e) {

        keys[e.key] = true;


        /*
         * RIGHT ALT = SECRET SCREEN
         */
        if (e.code === "AltRight") {

            e.preventDefault();

            openSecret();

        }


        /*
         * R = RESTART
         */
        if (
            e.key.toLowerCase() === "r" &&
            !gameRunning
        ) {

            restartGame();

        }

    });


    document.addEventListener("keyup", function(e) {

        keys[e.key] = false;

    });


    /*
     * OPEN SECRET SCREEN
     */
    function openSecret() {

        secretScreen.style.display = "flex";

        gameRunning = false;


        /*
         * Load the AdSense unit once.
         */
        if (!secretAdLoaded) {

            try {

                (adsbygoogle =
                    window.adsbygoogle || [])
                    .push({});

                secretAdLoaded = true;

            } catch (error) {

                console.log(
                    "AdSense could not load:",
                    error
                );

            }

        }

    }


    /*
     * CLOSE SECRET SCREEN
     */
    function closeSecret() {

        secretScreen.style.display = "none";

        gameRunning = true;

    }


    /*
     * SPAWN COIN
     */
    function spawnCoin() {

        if (!gameRunning) return;


        const coin =
            document.createElement("div");

        coin.className = "coin";


        const x =
            Math.random() *
            (window.innerWidth - 35);


        coin.style.left =
            x + "px";

        coin.style.top =
            "-35px";


        game.appendChild(coin);


        coins.push({

            element: coin,

            x: x,

            y: -35,

            speed:
                3 + Math.random() * 3

        });

    }


    /*
     * GAME LOOP
     */
    function update() {

        if (gameRunning) {


            /*
             * MOVE LEFT
             */
            if (
                keys["ArrowLeft"] ||
                keys["a"] ||
                keys["A"]
            ) {

                playerX -= 7;

            }


            /*
             * MOVE RIGHT
             */
            if (
                keys["ArrowRight"] ||
                keys["d"] ||
                keys["D"]
            ) {

                playerX += 7;

            }


            /*
             * KEEP PLAYER ON SCREEN
             */
            playerX = Math.max(
                0,
                Math.min(
                    window.innerWidth - 45,
                    playerX
                )
            );


            player.style.left =
                playerX + "px";


            /*
             * UPDATE COINS
             */
            for (
                let i = coins.length - 1;
                i >= 0;
                i--
            ) {

                const coin = coins[i];


                coin.y += coin.speed;


                coin.element.style.top =
                    coin.y + "px";


                /*
                 * COLLISION
                 */
                const playerRect =
                    player.getBoundingClientRect();

                const coinRect =
                    coin.element.getBoundingClientRect();


                const collision =

                    playerRect.left <
                    coinRect.right &&

                    playerRect.right >
                    coinRect.left &&

                    playerRect.top <
                    coinRect.bottom &&

                    playerRect.bottom >
                    coinRect.top;


                /*
                 * COLLECT COIN
                 */
                if (collision) {

                    score++;

                    scoreDisplay.textContent =
                        score;


                    coin.element.remove();

                    coins.splice(i, 1);

                    continue;

                }


                /*
                 * MISSED COIN
                 */
                if (
                    coin.y >
                    window.innerHeight
                ) {

                    coin.element.remove();

                    coins.splice(i, 1);

                    gameOver();

                    break;

                }

            }

        }


        requestAnimationFrame(update);

    }


    /*
     * GAME OVER
     */
    function gameOver() {

        gameRunning = false;

        finalScore.textContent =
            score;

        gameOverScreen.style.display =
            "flex";

    }


    /*
     * RESTART
     */
    function restartGame() {


        /*
         * Remove coins
         */
        coins.forEach(function(coin) {

            coin.element.remove();

        });


        coins = [];


        /*
         * Reset score
         */
        score = 0;

        scoreDisplay.textContent =
            "0";


        /*
         * Reset player
         */
        playerX =
            window.innerWidth / 2;

        player.style.left =
            playerX + "px";


        /*
         * Hide screens
         */
        gameOverScreen.style.display =
            "none";

        secretScreen.style.display =
            "none";


        /*
         * Resume
         */
        gameRunning = true;

    }


    /*
     * SPAWN COINS
     */
    setInterval(
        spawnCoin,
        700
    );


    /*
     * START
     */
    update();

</script>

</body>
</html>
